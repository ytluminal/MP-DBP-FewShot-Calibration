name: Import research repository snapshot

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-snapshot-import
  cancel-in-progress: false

jobs:
  import:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'research-snapshot-2026-11-26' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and verify research archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/mpdbp-snapshot
          gh release download research-snapshot-2026-11-26 --repo "$GITHUB_REPOSITORY" --pattern MP_DBP_clean_snapshot_20261126.zip --dir /tmp/mpdbp-snapshot
          cd /tmp/mpdbp-snapshot
          echo "c7c4cd90ecbb79ea349b923de9031c3710582b1c516cd29ae9a8afb3b6f936d1  MP_DBP_clean_snapshot_20261126.zip" | sha256sum --check

      - name: Verify manifest and import files
        shell: bash
        run: |
          python - <<'PY'
          import ast, hashlib, json, stat, zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("/tmp/mpdbp-snapshot/MP_DBP_clean_snapshot_20261126.zip")
          root = Path.cwd()
          with zipfile.ZipFile(archive) as z:
              members = [i for i in z.infolist() if not i.is_dir()]
              names = [i.filename for i in members]
              if len(names) != 710 or len(set(names)) != 710:
                  raise SystemExit("Unexpected archive membership")
              if z.testzip() is not None:
                  raise SystemExit("ZIP integrity failure")
              for i in members:
                  p = PurePosixPath(i.filename)
                  if (p.is_absolute() or ".." in p.parts or "\\" in i.filename
                      or any(part in (".git", ".github") for part in p.parts)
                      or stat.S_ISLNK(i.external_attr >> 16)):
                      raise SystemExit("Unsafe archive path")
              records = json.loads(z.read("MANIFEST_SHA256.json"))["files"]
              if len(records) != 709 or set(names) != {"MANIFEST_SHA256.json"} | {r["path"] for r in records}:
                  raise SystemExit("Manifest membership mismatch")
              for r in records:
                  b = z.read(r["path"])
                  if hashlib.sha256(b).hexdigest() != r["sha256"] or len(b) != r["size_bytes"]:
                      raise SystemExit("Manifest integrity failure: " + r["path"])
                  if r["path"].endswith(".py"):
                      ast.parse(b.decode("utf-8-sig"), filename=r["path"])
              for i in members:
                  target = root.joinpath(*PurePosixPath(i.filename).parts)
                  b = z.read(i)
                  if target.exists() and (not target.is_file() or target.read_bytes() != b):
                      raise SystemExit("Refusing to overwrite different existing file: " + i.filename)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(b)
          print("Verified and imported 710 files.")
          PY

      - name: Commit research files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import research data, code and reproducibility results"
            git push origin HEAD:main
          fi
